apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-certificates
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure-cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/networking/certificates
  prune: true
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
