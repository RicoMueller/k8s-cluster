apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: affine
  namespace: databases
spec:
  cluster:
    name: pantheon-pg
  name: affine
  owner: affine
  # AFFiNE >= 0.21 braucht pgvector (vector-Spalten im Schema, auch ohne KI).
  # CNPG legt die Extension mit Superuser-Rechten an -> der App-User braucht
  # kein CREATE-EXTENSION-Recht.
  extensions:
    - name: vector
      ensure: present
