apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - opencloud-secret.yaml
  - opencloud-smtp-secret.yaml
  - keycloak/keycloak.yaml
  - httproutes.yaml
configMapGenerator:
  - name: keycloak-realm
    namespace: opencloud
    files:
      - openCloud-realm.json=keycloak/opencloud-realm.json   # Keycloak 26.8: Dateiname = Realm-Name
