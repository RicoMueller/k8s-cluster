# Migrationsskript für die suspendierten CronJobs migration-* (Rezept F.2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-migration-script
  namespace: opencloud
data:
  migrate.sh: |
    #!/bin/sh
    set -eu
    # rclone schreibt beim Token-Refresh in die Config -> beschreibbare Kopie (Stolperstein 10)
    cp /secret/rclone.conf /work/rclone.conf
    export RCLONE_CONFIG=/work/rclone.conf HOME=/work
    # --timeout 1h: nach einem PUT von mehreren GB antwortet OpenCloud erst nach Minuten; bei 5 min (Default)
    # brach rclone ab, wiederholte und füllte den Papierkorb mit Fassungen (F.4a, 22.11.2026).
    L="--tpslimit 12 --retries 10 --low-level-retries 20 --timeout 1h --stats 10m --stats-one-line --stats-log-level NOTICE"
    # Von Rico am 22.11.2026 zum Löschen bestimmt (Demo-VMs früherer Arbeitgeber, 865 GB, seit 2019 unverändert).
    # Ausschluss als Absicherung, falls irgendwo noch ein Rest liegt. Pfade relativ zu 0_PRIVAT bzw. zur Wurzel.
    X_PRIV="--exclude /05_ARBEITGEBER/Matrix42?AG/07_IT/Technical?Demos/EgoSecure?Demo/**"
    X_ROOT="--exclude /0_PRIVAT/05_ARBEITGEBER/Matrix42?AG/07_IT/Technical?Demos/EgoSecure?Demo/**"
    case "$MODE" in
      probe)
        rclone about dropbox: || true
        rclone size dropbox: --fast-list --tpslimit 12
        rclone lsd dropbox: --tpslimit 12
        rclone about opencloud: || true
        rclone lsd opencloud:
        ;;
      test)
        rclone copy "dropbox:$TEST_DIR" "opencloud:$TEST_DIR" $L --log-level INFO
        rclone lsl "opencloud:$TEST_DIR"
        ;;
      seed)
        # Vorbefüllung aus PrivateCloud (= Dropbox/0_PRIVAT, NFS nur lesend) über das LAN (F.4a)
        # .streams = QNAP-Ablage für macOS-Dateiattribute aus SMB, .smbdelete* = SMB-Löschreste,
        # ~$* = Office-Sperrdateien; ohne diese Ausschlüsse wollte F.5 rund 3.450 Dateien löschen (23.11.2026).
        # --ignore-existing: nur Fehlendes nachlegen, nie neuere Dropbox-Fassungen überschreiben.
        # INFO: jede kopierte Datei steht mit Namen im Log (Wiederherstellung nach Löschung, 23.11.2026).
        rclone copy /seed opencloud:0_PRIVAT --ignore-existing --transfers 4 --checkers 8 $L --log-level INFO \
          --exclude "@Recycle/**" --exclude ".@__thumb/**" --exclude "@__thumb/**" --exclude ".DS_Store" \
          --exclude ".streams/**" --exclude ".smbdelete*" --exclude "~\$*" $X_PRIV
        ;;
      copy)
        # Nur copy, kein sync: Der sync auf 0_PRIVAT (mig-copy-1, 23.11.2026) wollte außer QNAP-Müll nur
        # Dokumente löschen, die allein auf PrivateCloud lagen (TUSKA). copy löscht nie; überschriebene
        # Fassungen landen im OpenCloud-Papierkorb.
        rclone copy dropbox: opencloud: --fast-list --transfers 4 --checkers 8 $X_ROOT $L --log-level NOTICE
        ;;
      check)
        # Dropbox-Hash gegen den lokalen PosixFS-Baum (lesend eingehängt), Stolperstein 12
        rclone check dropbox: "$SPACE_PATH" --one-way --fast-list --tpslimit 12 $X_ROOT \
          --combined /work/combined.txt || true
        echo "== Zusammenfassung =="
        printf "gleich:      %s\n" "$(grep -c '^= ' /work/combined.txt || true)"
        printf "fehlt:       %s\n" "$(grep -c '^- ' /work/combined.txt || true)"
        printf "abweichend:  %s\n" "$(grep -c '^\* ' /work/combined.txt || true)"
        printf "Fehler:      %s\n" "$(grep -c '^! ' /work/combined.txt || true)"
        echo "== Abweichungen (max. 200) =="
        grep -v '^= ' /work/combined.txt | head -200 || true
        ;;
      *) echo "unbekannter MODE=$MODE"; exit 2 ;;
    esac
