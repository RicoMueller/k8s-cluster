# Öffentlich (HTTP- und HTTPS-Listener): nur der OpenCloud-Realm und statische Ressourcen.
# Bewusst nicht /realms/ — darunter läge auch der Admin-Realm master (Stolperstein 4).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: opencloud
spec:
  parentRefs:
    - name: pantheon-gateway
      namespace: default
  hostnames:
    - keycloak.rm-it.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/openCloud
        - path:
            type: PathPrefix
            value: /resources
      filters:
        - type: RequestHeaderModifier   # Tunnel -> HTTP-Listener: Envoy überschreibt X-Forwarded-Proto mit http
          requestHeaderModifier:        # -> OpenCloud 308-Schleife, Keycloak-Cookies ohne Secure (Stolperstein 5).
            set:                        # Außen erzwingt Cloudflare HTTPS ("Always Use HTTPS"), am HTTPS-Listener ohnehin https.
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: keycloak
          port: 8080
---
# Administration: NUR am HTTPS-Listener. Der Tunnel liefert an den HTTP-Listener -> von außen nicht erreichbar.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
  namespace: opencloud
spec:
  parentRefs:
    - name: pantheon-gateway
      namespace: default
      sectionName: https
  hostnames:
    - keycloak-admin.rm-it.org
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
---
# Admin-Realm master auf dem Haupt-Hostnamen: NUR am HTTPS-Listener (LAN).
# Die Admin-Konsole (keycloak-admin.rm-it.org) meldet über authServerUrl = KC_HOSTNAME an
# und prüft dort /realms/master/.../3p-cookies. Über den Tunnel (HTTP-Listener) bleibt
# /realms/master gesperrt (Stolperstein 4, 31).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-master-lan
  namespace: opencloud
spec:
  parentRefs:
    - name: pantheon-gateway
      namespace: default
      sectionName: https
  hostnames:
    - keycloak.rm-it.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/master
      backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: opencloud
spec:
  parentRefs:
    - name: pantheon-gateway
      namespace: default
  hostnames:
    - cloud.rm-it.org
  rules:
    - timeouts:
        request: "0s"                  # Gateway API: 0s = kein Timeout (große Downloads, lange WebDAV-Transfers)
      filters:
        - type: RequestHeaderModifier   # Tunnel -> HTTP-Listener: Envoy überschreibt X-Forwarded-Proto mit http
          requestHeaderModifier:        # -> OpenCloud 308-Schleife, Keycloak-Cookies ohne Secure (Stolperstein 5).
            set:                        # Außen erzwingt Cloudflare HTTPS ("Always Use HTTPS"), am HTTPS-Listener ohnehin https.
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: opencloud
          port: 9200
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: collabora
  namespace: opencloud
spec:
  parentRefs:
    - name: pantheon-gateway
      namespace: default
  hostnames:
    - collabora.rm-it.org
  rules:
    - timeouts:
        request: "0s"                  # Editier-Sitzungen laufen über langlebige WebSockets
      backendRefs:
        - name: collabora
          port: 9980
