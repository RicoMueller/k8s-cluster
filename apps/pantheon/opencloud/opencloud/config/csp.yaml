# CSP für OpenCloud auf Pantheon — aus opencloud-compose d4695d2 config/opencloud/csp.yaml.
# Vorlagenvariablen durch Pantheon-Hostnamen ersetzt (Stolperstein 21); Companion und Euro-Office
# entfernt (nicht im Einsatz). Wird mit der eingebauten CSP von OpenCloud zusammengeführt.
directives:
  child-src:
    - '''self'''
  connect-src:
    - '''self'''
    - 'blob:'
    - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
    - 'https://keycloak.rm-it.org/'
    - 'https://update.opencloud.eu/'
    - 'https://tile.openstreetmap.org/'
  default-src:
    - '''none'''
  font-src:
    - '''self'''
  frame-ancestors:
    - '''self'''
  frame-src:
    - '''self'''
    - 'blob:'
    - 'https://embed.diagrams.net/'
    # In contrary to bash and docker the default is given after the | character
    - 'https://collabora.rm-it.org/'
    # This is needed for the external-sites web extension when embedding sites
    - 'https://docs.opencloud.eu'
    - 'https://keycloak.rm-it.org/'
  img-src:
    - '''self'''
    - 'data:'
    - 'blob:'
    - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
    - 'https://tile.openstreetmap.org/'
    # In contrary to bash and docker the default is given after the | character
    - 'https://collabora.rm-it.org/'
  manifest-src:
    - '''self'''
  media-src:
    - '''self'''
    - 'blob:'
  object-src:
    - '''self'''
    - 'blob:'
  script-src:
    - '''self'''
    - '''unsafe-inline'''
    - 'https://keycloak.rm-it.org/'
  style-src:
    - '''self'''
    - '''unsafe-inline'''
    - 'blob:'
  worker-src:
    - "'self'"
    - 'blob:'
