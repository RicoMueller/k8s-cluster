apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless-test
spec:
  parentRefs:
    - name: pantheon-gateway
      namespace: default
  hostnames:
    # BEWUSST nur LAN-intern — kein rm-it.org-Hostname (kein externer Zugriff, C.5)
    - paperless-test.pantheon.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paperless
          port: 80
