apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      securityContext:
        # baseline wie Produktiv (paperless-Namespace). Die restricted-Härtung
        # (runAsNonRoot + USERMAP_UID) wird bewusst spaeter fuer BEIDE Systeme
        # gemeinsam eingefuehrt — nicht als stille Abweichung nur im Test.
        fsGroup: 1000
      # Stolperstein B (siehe B.10): Service-Link-Kollision mit PAPERLESS_PORT
      enableServiceLinks: false
      containers:
        - name: paperless
          # Manuell gepinnt auf die Produktivversion (C.5.1). BEWUSST keine
          # Renovate-Annotation: Renovate haelt nur das Produktivsystem nach.
          # Beim Versionssprung wird dieser Tag von Hand angehoben (C.5.1.1) —
          # das Testsystem darf dem Produktivsystem vorauslaufen.
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: pantheon-pg-rw.databases.svc.cluster.local
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: paperless_test
            - name: PAPERLESS_DBUSER
              value: paperless_test
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: db-password
            - name: PAPERLESS_REDIS
              value: redis://paperless-redis:6379
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: secret-key
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            - name: PAPERLESS_OCR_LANGUAGE
              value: deu+eng
            # Worker-Tuning wie Produktiv (Produkt = CPU-Limit, Teil D.1)
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "2"
            - name: PAPERLESS_WEBSERVER_WORKERS
              value: "1"
            - name: PAPERLESS_URL
              value: http://paperless-test.pantheon.local
            # === Staging-Isolation (C.5.2) ===
            # Der Backup-Import bringt Mail-Konten UND Mail-Regeln in die DB.
            # Ohne "disable" fragt das Testsystem dieselben echten Postfaecher
            # ab wie das Produktivsystem und schnappt ihm je nach Regel Mails weg.
            - name: PAPERLESS_EMAIL_TASK_CRON
              value: disable
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: admin-password
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: backup
              mountPath: /backup
              readOnly: true
            - name: consume
              mountPath: /usr/src/paperless/consume
          # Stolperstein C (siehe B.10): Host-Header mitschicken, sonst lehnt
          # Django die Probe-Anfrage mit der Pod-IP als DisallowedHost ab.
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
              httpHeaders:
                - name: Host
                  value: paperless-test.pantheon.local
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
              httpHeaders:
                - name: Host
                  value: paperless-test.pantheon.local
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: backup
          persistentVolumeClaim:
            claimName: paperless-backup-ro
            readOnly: true
        - name: consume
          emptyDir: {}
