apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
  settings.yaml: |
    title: Pantheon
    headerStyle: clean
    background:
      image: https://images.unsplash.com/photo-1644088379091-d574269d422f?q=80&w=2186&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 40
    quicklaunch:
      provider: custom
      url: https://www.ecosia.org/search?q=
      target: _blank
      suggestionUrl: https://ac.ecosia.org/autocomplete?type=list&q=
    layout:
      Services:
        style: row
        columns: 3
      Infrastruktur:
        style: row
        columns: 4
      Netzwerk:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 3
      Dashboards:
        style: row
        columns: 1
      Entwicklung:
        style: row
        columns: 1
      Test:
        style: row
        columns: 1
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
  proxmox.yaml: ""
  services.yaml: |
    - Services:
        - Paperless-ngx:
            icon: paperless-ngx.png
            href: http://paperless.pantheon.local/
            description: Dokumentenmanagement
            widget:
              type: paperlessngx
              url: http://paperless.paperless.svc.cluster.local
              key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"
        # Homepage v2.7.0 hat kein AFFiNE-Widget -> customapi auf /info.
        # /info ist öffentlich (kein Token nötig). Clusterinterne Adresse, weil von
        # außen Cloudflare Access mit 302 antwortet und die Kachel sonst auch bei
        # ausgefallenem AFFiNE grün wäre.
        - AFFiNE:
            icon: affine-light.png
            href: https://affine.rm-it.org/
            description: Whiteboard
            siteMonitor: http://affine.affine.svc.cluster.local/info
            widget:
              type: customapi
              url: http://affine.affine.svc.cluster.local/info
              refreshInterval: 60000
              mappings:
                - field: compatibility
                  label: Version
                - field: type
                  label: Typ
        # Homepage v2.8.0 hat kein OpenCloud-Widget -> customapi auf /status.php
        # (öffentlich, ownCloud-kompatibel). Clusterintern aus demselben Grund wie AFFiNE.
        # Kein OpenCloud-Icon in den Dashboard-Icons -> Material Design Icon.
        - OpenCloud:
            icon: mdi-cloud
            href: https://cloud.rm-it.org/
            description: Dateiablage
            siteMonitor: http://opencloud.opencloud.svc.cluster.local:9200/status.php
            widget:
              type: customapi
              url: http://opencloud.opencloud.svc.cluster.local:9200/status.php
              refreshInterval: 60000
              mappings:
                - field: productversion
                  label: Version
                - field: edition
                  label: Edition
    - Infrastruktur:
        - QNAP NAS:
            icon: qnap.png
            href: http://192.168.178.42:8080/
            description: TS-453B Nostromo
        - Proxmox VE:
            icon: proxmox.png
            href: https://192.168.178.160:8006/
            description: VM-Host
            widget:
              type: proxmox
              url: https://192.168.178.160:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
        - Sidero Omni:
            icon: talos.png
            href: https://omni.rm-it.org/
            description: Cluster-Management
        # Kein Keycloak-Widget in Homepage v2.8.0; Version/Statistik nur mit Admin-Token.
        # Daher nur siteMonitor auf den öffentlichen Realm-Endpunkt (Port 9000/health
        # liegt nicht im Service). Link auf die Admin-Konsole (nur LAN, HTTPS-Listener).
        - Keycloak:
            icon: keycloak.png
            href: https://keycloak-admin.rm-it.org/
            description: Identitäten
            siteMonitor: http://keycloak.opencloud.svc.cluster.local:8080/realms/openCloud
    - Netzwerk:
        - FRITZ!Box:
            icon: fritzbox.png
            href: http://192.168.178.1/
            description: Internet-Gateway
            widget:
              type: fritzbox
              url: http://192.168.178.1
        - AdGuard Home:
            icon: adguard-home.png
            href: http://192.168.178.53/
            description: DNS-Filter
            widget:
              type: adguard
              url: http://192.168.178.53
              username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
        - MikroTik Switching:
            icon: mikrotik.png
            href: http://192.168.178.144/
            description: RouterOS
            widget:
              type: mikrotik
              url: https://192.168.178.144
              username: "{{HOMEPAGE_VAR_MIKROTIK_SWITCHING_USERNAME}}"
              password: "{{HOMEPAGE_VAR_MIKROTIK_SWITCHING_PASSWORD}}"
        - MikroTik Kubernetes:
            icon: mikrotik.png
            href: http://192.168.178.171/
            description: RouterOS
            widget:
              type: mikrotik
              url: https://192.168.178.171
              username: "{{HOMEPAGE_VAR_MIKROTIK_KUBERNETES_USERNAME}}"
              password: "{{HOMEPAGE_VAR_MIKROTIK_KUBERNETES_PASSWORD}}"
        - Netgear Switch:
            icon: netgear.png
            href: http://192.168.178.45/
            description: Managed Switch
    # Monitoring außerhalb des Clusters (LXC auf Proxmox, external/monitoring/).
    # Links mit Namen (AdGuard-Rewrite, für den Browser), Widgets mit IP (Pod).
    - Monitoring:
        # /api/health ist ohne Anmeldung erreichbar.
        - Grafana:
            icon: grafana.png
            href: http://grafana.pantheon.local:3000/d/pantheon-vorgaenge
            description: Vorgänge
            siteMonitor: http://192.168.178.178:3000/api/health
        # Zählt nur Alarme, die wirklich benachrichtigen. Watchdog und Hinweise
        # (Empfänger silent) bleiben außen vor, sonst stünde die Kachel nie auf 0.
        - Alertmanager:
            icon: alertmanager.png
            href: http://alertmanager.pantheon.local:9093/
            description: Alarme
            widget:
              type: customapi
              url: http://192.168.178.97:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&receiver=%5E(notfall%7Cpush-backup-info%7Cpush-backup-warn)%24
              refreshInterval: 60000
              mappings:
                - label: Aktive Alarme
                  format: size
        # Nur Link: Basic-Auth auf allen Endpunkten, das prometheus-Widget kann
        # sich nicht anmelden, ein siteMonitor stünde dauerhaft auf 401.
        - Prometheus:
            icon: prometheus.png
            href: http://prometheus.pantheon.local:9090/
            description: Metriken
  bookmarks.yaml: |
    - Entwicklung:
        - GitHub:
            - abbr: GH
              href: https://github.com/RicoMueller/k8s-cluster
        - Cloudflare Dashboard:
            - abbr: CF
              href: https://dash.cloudflare.com/
        - Hetzner Console:
            - abbr: HZ
              href: https://console.hetzner.com
    - Test:
        - Paperless-ngx:
            - abbr: PP
              href: http://paperless-test.pantheon.local/
    - Dashboards:
        - Pantheon – Vorgänge:
            - abbr: PV
              href: http://grafana.pantheon.local:3000/d/pantheon-vorgaenge
        - Pantheon – Wartung:
            - abbr: PW
              href: http://grafana.pantheon.local:3000/d/pantheon-wartung
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Pantheon"
        nodes:
          show: false
    - search:
        provider: custom
        url: https://www.ecosia.org/search?q=
        suggestionUrl: https://ac.ecosia.org/autocomplete?type=list&q=
        target: _blank
